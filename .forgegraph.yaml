# ForgeGraph delivery for Hall Monitor (HM-12). A merge to main deploys the production target from
# a ForgeGraph node once CI is green: `buildCommand` and then `deployCommand` run in `appDir`
# (apps/worker), with Cloudflare credentials from the workspace integration.
#
# `appDir` is explicit on purpose (HM-18). Without it the agent takes the first shallow, sorted
# apps/* directory holding a wrangler config; once apps/telemetry-worker existed that sorted ahead
# of apps/worker, and the deploy failed with "Command wrangler not found" because the telemetry
# package has no Wrangler dependency. `configPath` alone does not pin the build directory.
#
# The Worker's per-deployment configuration lives in ForgeGraph stage secrets
# (`forge secret set <KEY> --stage production --stdin`): HM_DIGEST_KEY, HM_TRUSTED_ISSUERS and,
# optionally, HM_POLICY_OVERLAYS, HM_TENANT_MODES and HM_AI_GATEWAY_ID. `syncSecrets` copies every
# stage secret to the Worker after each deploy; see apps/worker/wrangler.jsonc for why they are
# secrets rather than vars.

app: hall-monitor
server: https://forgegraf.com

stages:
  - name: production
    url: https://hall-monitor.gmac.io
    sortOrder: 20
    targets:
      - name: worker
        platform: cloudflare-workers
        nodeId: bf11e7b1-b9de-45be-a89d-ae08049c7598  # hetzner-fg runs the deploy
        config:
          workerName: hall-monitor
          appDir: apps/worker
          configPath: apps/worker/wrangler.jsonc
          buildCommand: pnpm install --frozen-lockfile
          deployCommand: pnpm exec wrangler deploy --domain hall-monitor.gmac.io
          syncSecrets: true
          # The production health probe ForgeGraph runs after a deploy, and that its delivery
          # receipts to Kanbanger cite; the top-level `health` block does not set it.
          healthCheckUrl: https://hall-monitor.gmac.io/v1/health

health:
  # Unauthenticated liveness. Readiness (/v1/ready) needs a service token and is checked by hand.
  url: /v1/health
  interval: 60
  timeout: 10
