# Hall Monitor CI on ForgeGraph (git.forgegraf.com). Forgejo ignores .github/workflows when this
# directory exists; GitHub (gmackie/hall-monitor, a push mirror) still runs those, releases included.
name: CI

on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    # Fleet kit v1: `apps` runners carry the persistent /pnpm-store mount.
    runs-on: apps
    timeout-minutes: 20
    steps:
      - name: Superseded?
        id: superseded
        uses: https://git.forgegraf.com/gmackie/ci-actions/fleet/superseded@ddd693744c0254b1cb078eec0e4d5a1bc38f57eb

      - if: steps.superseded.outputs.skip != 'true'
        uses: actions/checkout@v4

      # Fleet kit v1: Node 24 + pnpm (version from `packageManager`), then
      # `pnpm install --frozen-lockfile` (retried) on the runner's persistent
      # pnpm store; no archive cache.
      - name: Set up toolchain and install
        if: steps.superseded.outputs.skip != 'true'
        uses: https://git.forgegraf.com/gmackie/ci-actions/fleet/setup@ddd693744c0254b1cb078eec0e4d5a1bc38f57eb
        with:
          node-version: 24
          registry-token: ${{ secrets.FG_REGISTRY_TOKEN }}
          turbo-token: ${{ secrets.TURBO_TOKEN }}
          turbo-team: ci

      - if: steps.superseded.outputs.skip != 'true'
        run: pnpm lint 2>&1 | tee -a "$RUNNER_TEMP/ci.log"
        shell: bash # -eo pipefail keeps the command's exit code through tee
      # Podman's disk-backed /tmp on the canonical runner can stall SQLite fsyncs long enough to
      # time out Worker tests. Use ephemeral tmpfs scratch space; the real SQLite store, per-test
      # storage isolation, assertions and test deadlines are unchanged.
      - name: Run tests and rollback drill with memory-backed scratch storage
        if: steps.superseded.outputs.skip != 'true'
        run: |
          set -eu
          test_tmpdir=$(mktemp -d /dev/shm/hall-monitor-tests.XXXXXX)
          trap 'rm -rf "$test_tmpdir"' EXIT
          export TMPDIR="$test_tmpdir"
          pnpm test
          pnpm rollback-drill --out rollback-drill.json
      - name: Check the Worker bundles
        if: steps.superseded.outputs.skip != 'true'
        run: node scripts/deploy-worker.mjs --dry-run

      # The receiver is stateful and internal-only: bundle it (dry run, never deployed) and check
      # its config still has no route, workers.dev or extra bindings.
      - name: Check the telemetry receiver bundle
        if: steps.superseded.outputs.skip != 'true'
        run: node scripts/deploy-telemetry-worker.mjs --dry-run

      - name: Report CI result to ForgeGraph
        if: always() && steps.superseded.outputs.skip != 'true'
        uses: https://git.forgegraf.com/gmackie/ci-actions/fleet/report@ddd693744c0254b1cb078eec0e4d5a1bc38f57eb
        with:
          token: ${{ secrets.FORGEGRAPH_TOKEN }}
          status: ${{ job.status }}
          workflow-name: CI
          log-file: ${{ runner.temp }}/ci.log
