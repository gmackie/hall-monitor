# Hall Monitor CI on ForgeGraph (git.forgegraf.com). Forgejo ignores .github/workflows when this
# directory exists; GitHub (gmackie/hall-monitor, a push mirror) still runs those, releases included.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      # pnpm's version comes from `packageManager` in package.json.
      - name: Enable Corepack
        run: corepack enable

      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm test
      - run: pnpm rollback-drill --out rollback-drill.json
      - name: Check the Worker bundles
        run: node scripts/deploy-worker.mjs --dry-run

      # The receiver is stateful and internal-only: bundle it (dry run, never deployed) and check
      # its config still has no route, workers.dev or extra bindings.
      - name: Check the telemetry receiver bundle
        run: node scripts/deploy-telemetry-worker.mjs --dry-run

      - name: Report CI result to ForgeGraph
        if: always()
        env:
          FG_CI_TOKEN: ${{ secrets.FORGEGRAPH_TOKEN }}
        run: |
          case "${{ job.status }}" in
            success) STATUS=success ;;
            cancelled) STATUS=cancelled ;;
            *) STATUS=failure ;;
          esac
          REPO_FULL="${{ github.repository }}"
          curl -sf -X POST "https://forgegraf.com/api/fg/ci/report" \
            -H "Authorization: Bearer ${FG_CI_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{
              \"owner\": \"${REPO_FULL%%/*}\",
              \"repo\": \"${REPO_FULL##*/}\",
              \"sha\": \"${{ github.event.pull_request.head.sha || github.sha }}\",
              \"branch\": \"${{ github.head_ref || github.ref_name }}\",
              \"status\": \"${STATUS}\",
              \"runId\": \"${{ github.run_id }}\",
              \"runUrl\": \"${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}\",
              \"workflowName\": \"CI\"
            }" || echo "::warning::Failed to report CI result to ForgeGraph"
